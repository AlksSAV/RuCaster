name: rucaster

services:
  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
    container_name: rucaster-backend
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - rucaster-data:/app/data
    ports:
      - "2101:2101"          # NTRIP
    expose:
      - "8001"               # HTTP API (наружу через nginx)
    networks:
      - rucaster

  frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/Dockerfile.frontend
    container_name: rucaster-frontend
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - rucaster

  nginx:
    image: nginx:1.27-alpine
    container_name: rucaster-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"         # включить после настройки TLS
      # - "2102:2101"       # NTRIP over TLS (если нужен)
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./certs:/etc/nginx/certs:ro   # TLS-сертификаты
    depends_on:
      - backend
      - frontend
    networks:
      - rucaster

volumes:
  rucaster-data:

networks:
  rucaster:
    driver: bridge
